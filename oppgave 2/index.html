<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fakultet Kalkulator</title>
</head>
<body>
        <div id="fizzbuzz">
    <form>
        <input name="tall" placeholder="Tall" type="number">
        <button type="submit">Regn ut FizzBuzz</button>
    </form>
    <p>
        Resultatet er: <span class="resultat"></span>
    </p>
</div>
</body>
<script type="module">
    import { fizzBuzz } from './fizzbuzz.js'

function regnUtFizzBuzz(evt) {
    evt.preventDefault();
    const input = document.querySelector('#fizzbuzz input');
    const output = document.querySelector('#fizzbuzz .resultat');

    const tall = parseInt(input.value);

    if (!isNaN(tall)) {
        output.textContent = fizzBuzz(tall);
    } else {
        output.textContent = "Vennligst skriv inn et tall";
    }
}

document.querySelector('#fizzbuzz button')
    .addEventListener('click', regnUtFizzBuzz);
</script>
</html>
